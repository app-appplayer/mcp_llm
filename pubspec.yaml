name: mcp_llm
description: "LLMs with the Model Context Protocol: nine providers plus custom, MCP tools, sampling and servers over mcp_client / mcp_server (2024-11-05 through 2026-07-28), mcp_bundle ports."
version: 3.0.0
homepage: https://app-appplayer.github.io/makemind
repository: https://github.com/app-appplayer/mcp_llm
issue_tracker: https://github.com/app-appplayer/mcp_llm/issues

topics:
  - llm
  - mcp
  - ai
  - dart
  - flutter

environment:
  sdk: ^3.7.2

dependencies:
  # Contract Layer for knowledge package integration
  mcp_bundle: ^0.4.0

  # Core dependencies
  http: ^1.1.0
  json_annotation: ^4.9.0
  uuid: ^4.0.0
  collection: ^1.19.1
  logging: ^1.2.0
  crypto: ^3.0.3
  
  # Storage and persistence
  sqlite3: ^2.1.0
  path: ^1.8.3
  
dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
  mockito: ^5.4.5
  build_runner: ^2.4.15
  faker: ^2.1.0  # test data

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows: